plugins { id 'com.android.application' }
def buildRevision = (findProperty('buildRevision') ?: 'local').toString().replaceAll('[^a-zA-Z0-9._-]', '').take(40)
android {
 namespace 'com.hipnote.bungbung'
 compileSdk 35
 buildFeatures { buildConfig true }
 defaultConfig { applicationId 'com.hipnote.bungbung'; minSdk 28; targetSdk 35; versionCode 1; versionName "0.1.0-demo.${buildRevision}"; buildConfigField 'String', 'BUILD_REVISION', '"' + buildRevision + '"' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1'; implementation 'ai.pleos.playground:Vehicle:2.3.2' }
