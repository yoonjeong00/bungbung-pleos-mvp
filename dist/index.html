<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f2f8"><title>붕붕이 · 토토와 함께하는 드라이브</title><link rel="stylesheet" href="hmi.css"></head><body><main class="studio"><div class="studio-bar"><span><b>붕붕이</b> <span class="subtle">WHITE HMI</span></span><div><span class="mock-label">모의 데이터</span><button id="demo-toggle">시연 패널</button><button id="fullscreen">전체 화면</button><a href="downloads/bungbung-mvp.zip" download>소스 다운로드</a></div></div><div class="device"><div class="screen"><header class="system-top"><span id="system-time">12:45</span><span class="system-status">▥ &nbsp;5G &nbsp; ♧ &nbsp; ◉</span></header><div id="screen-body" class="screen-body"></div><footer id="system-dock" class="system-dock"></footer></div></div><div class="studio-note"><span>붕붕이 · 토토의 음악방</span><span>차량 프레임·지도는 시연용 / 실제 차량 제어 없음</span></div><section id="demo-panel" class="demo-panel" hidden><div class="demo-head"><div><small>TEAM 01 · VIRTUAL VEHICLE</small><h2>한 번의 드라이브, 열 개의 장면</h2></div><div><button id="play">S1–S5 재생</button><button id="pause">일시정지</button><button id="resume">이어 재생</button><button id="step">다음 단계</button><button id="reset">시연 초기화</button></div></div><div id="scenario-list" class="scenario-list"></div><div class="view-list"><span>화면 바로 보기</span><button data-preview="home">내 방</button><button data-preview="growth">성장 기록</button><button data-preview="badges">배지 도감</button><button data-preview="closet">꾸미기</button><button data-preview="recovery">주유 회복</button><button data-preview="summary">하루 마무리</button><button data-preview="rain">빗길 주행</button><button data-preview="tire">타이어 경고</button><button data-preview="yellow">노란 경고</button><button data-preview="red">빨간 경고</button></div><form id="manual"><label>기어<select name="gear"><option>P</option><option>D</option><option>R</option><option>N</option></select></label><label>누적 거리 km<input name="odometerKm" type="number" min="
